<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

  :root {
    --primary-pink: #f6bbd0;
    --cream-white: #fff9f5;
    --wine-red: #6b1d2f;
    --sunset-purple: #1c0d26;
    --deep-night: #0e0614;
    --glass-bg: rgba(28, 13, 38, 0.62);
    --glass-border: rgba(246, 187, 208, 0.24);
    --paper-bg: #fdf8f2;
    --paper-ink: #3a1f28;
    --transition-speed: 850ms;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--deep-night);
    color: var(--cream-white);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Lớp nền ambient gradient và hiệu ứng film grain điện ảnh */
  .cinematic-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, rgba(107, 29, 47, 0.48) 0%, transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(246, 187, 208, 0.18) 0%, transparent 50%),
      linear-gradient(165deg, #0d0613 0%, var(--sunset-purple) 52%, #2c1229 100%);
    overflow: hidden;
  }

  .film-grain-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.055;
    background-image: radial-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 0);
    background-size: 24px 24px;
  }

  #ambient-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* Khung điện thoại 9:16 chuẩn trên cả Mobile & Desktop */
  .story-stage {
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 100%;
    max-height: 920px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  @media (min-width: 540px) {
    .story-stage {
      height: 94vh;
      border-radius: 28px;
      border: 1px solid rgba(246, 187, 208, 0.22);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.72), 0 0 50px rgba(246, 187, 208, 0.08);
      background: rgba(16, 7, 23, 0.38);
      backdrop-filter: blur(12px);
    }
  }

  /* Thanh điều khiển phía trên (Progress bar + Nhạc nền) */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: 14px 16px 10px;
    background: linear-gradient(180deg, rgba(10, 4, 15, 0.75) 0%, transparent 100%);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .story-progress-bars {
    display: flex;
    gap: 5px;
    width: 100%;
  }

  .progress-segment {
    flex: 1;
    height: 3px;
    background: rgba(255, 249, 245, 0.22);
    border-radius: 99px;
    overflow: hidden;
    cursor: pointer;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary-pink), #ffffff);
    border-radius: 99px;
    transition: width 0.25s linear;
  }

  .hud-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .scene-indicator-pill {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 249, 245, 0.85);
    background: rgba(28, 13, 38, 0.65);
    border: 1px solid var(--glass-border);
    padding: 5px 12px;
    border-radius: 99px;
    backdrop-filter: blur(8px);
  }

  .audio-controller {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(28, 13, 38, 0.72);
    border: 1px solid var(--glass-border);
    padding: 4px 10px 4px 6px;
    border-radius: 99px;
    backdrop-filter: blur(10px);
  }

  .vinyl-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--primary-pink);
    background: radial-gradient(circle, var(--wine-red) 28%, #16091c 30%, #2b1433 65%, #120617 100%);
    color: var(--cream-white);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.78rem;
  }

  .vinyl-btn.is-playing {
    animation: spinVinyl 6s linear infinite;
  }

  @keyframes spinVinyl {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .equalizer-bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .eq-bar {
    width: 2px;
    height: 4px;
    background: var(--primary-pink);
    border-radius: 2px;
    transition: height 0.2s ease;
  }

  .is-playing + .equalizer-bars .eq-bar:nth-child(1) { animation: eqBounce 0.7s ease-in-out infinite; }
  .is-playing + .equalizer-bars .eq-bar:nth-child(2) { animation: eqBounce 0.55s ease-in-out infinite 0.15s; }
  .is-playing + .equalizer-bars .eq-bar:nth-child(3) { animation: eqBounce 0.8s ease-in-out infinite 0.3s; }

  @keyframes eqBounce {
    0%, 100% { height: 3px; }
    50% { height: 12px; }
  }

  .volume-slider {
    width: 54px;
    height: 4px;
    accent-color: var(--primary-pink);
    cursor: pointer;
  }

  /* Hệ thống Cảnh (Scenes) & Chuyển cảnh */
  .scene-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 68px 22px 28px;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.03);
    filter: blur(8px);
    transition:
      opacity var(--transition-speed) cubic-bezier(0.22, 1, 0.36, 1),
      transform var(--transition-speed) cubic-bezier(0.22, 1, 0.36, 1),
      filter var(--transition-speed) cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 15;
  }

  .scene-layer.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
    filter: blur(0px);
    z-index: 25;
  }

  /* CẢNH 1: MỞ ĐẦU */
  .opening-card {
    text-align: center;
    max-width: 360px;
    padding: 36px 24px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(44, 19, 56, 0.72), rgba(20, 9, 29, 0.85));
    border: 1px solid var(--glass-border);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
  }

  .heart-halo {
    width: 68px;
    height: 68px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(246, 187, 208, 0.28) 0%, rgba(107, 29, 47, 0.15) 70%);
    border: 1px solid rgba(246, 187, 208, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.85rem;
    animation: pulseHeart 2.4s ease-in-out infinite;
  }

  @keyframes pulseHeart {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(246, 187, 208, 0.35); }
    50% { transform: scale(1.08); box-shadow: 0 0 28px 6px rgba(246, 187, 208, 0.22); }
  }

  .serif-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 2rem;
    font-weight: 600;
    line-height: 1.28;
    color: var(--cream-white);
    margin-bottom: 12px;
  }

  .recipient-badge {
    display: inline-block;
    margin: 6px 0 18px;
    padding: 5px 16px;
    border-radius: 99px;
    background: rgba(246, 187, 208, 0.15);
    border: 1px solid rgba(246, 187, 208, 0.35);
    color: var(--primary-pink);
    font-size: 0.9rem;
    font-weight: 500;
  }

  .romantic-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 99px;
    border: 1px solid rgba(255, 249, 245, 0.35);
    background: linear-gradient(135deg, var(--wine-red) 0%, #9b2c47 55%, #c95b78 100%);
    color: var(--cream-white);
    font-size: 0.96rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(107, 29, 47, 0.6);
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  }

  .romantic-btn:hover, .romantic-btn:focus-visible {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 34px rgba(201, 91, 120, 0.55);
    filter: brightness(1.07);
  }

  .romantic-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .secondary-btn {
    padding: 11px 20px;
    border-radius: 99px;
    border: 1px solid var(--glass-border);
    background: rgba(28, 13, 38, 0.72);
    color: var(--cream-white);
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .secondary-btn:hover {
    background: rgba(246, 187, 208, 0.18);
    border-color: var(--primary-pink);
  }

  /* CẢNH 2: NHỮNG KỶ NIỆM (POLAROID & 9:16 CINEMATIC FRAME) */
  .memory-stage-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
  }

  .polaroid-frame {
    position: relative;
    flex: 1;
    width: 100%;
    border-radius: 22px;
    padding: 10px 10px 16px;
    background: linear-gradient(180deg, rgba(255, 249, 245, 0.94) 0%, rgba(247, 236, 230, 0.92) 100%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .photo-viewport {
    position: relative;
    flex: 1;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #1a0d22;
  }

  .memory-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1);
    transition: opacity 0.65s ease, transform 6.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.65s ease;
  }

  .memory-photo.fit-contain {
    object-fit: contain;
    background: #120818;
  }

  .memory-photo.ken-burns-active {
    transform: scale(1.085);
  }

  .photo-tap-zones {
    position: absolute;
    inset: 0;
    display: flex;
    z-index: 12;
  }

  .tap-zone-prev, .tap-zone-next {
    flex: 1;
    height: 100%;
    cursor: pointer;
  }

  .polaroid-caption-box {
    padding: 12px 10px 2px;
    text-align: center;
    color: var(--paper-ink);
  }

  .memory-date-tag {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--wine-red);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .memory-caption-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.22rem;
    font-weight: 600;
    font-style: italic;
    line-height: 1.35;
    color: #2d141e;
  }

  .memory-footer-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* CẢNH 3: NHỮNG ĐIỀU ANH MUỐN NÓI */
  .confession-container {
    width: 100%;
    max-width: 390px;
    padding: 28px 22px;
    border-radius: 24px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .confession-line-item {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.42rem;
    line-height: 1.42;
    color: var(--cream-white);
    opacity: 0.12;
    transform: translateY(10px);
    filter: blur(4px);
    transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
    padding-left: 14px;
    border-left: 2px solid transparent;
  }

  .confession-line-item.revealed {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
    border-left-color: var(--primary-pink);
  }

  /* CẢNH 4: BỨC THƯ XIN LỖI */
  .letter-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .envelope-seal-stage {
    text-align: center;
    padding: 32px 24px;
    border-radius: 24px;
    background: linear-gradient(155deg, #fdf6ee 0%, #f5e3d3 100%);
    color: var(--paper-ink);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    max-width: 360px;
    width: 100%;
    cursor: pointer;
    transition: transform 0.35s ease;
  }

  .envelope-seal-stage:hover {
    transform: translateY(-4px);
  }

  .wax-seal-badge {
    width: 64px;
    height: 64px;
    margin: 14px auto;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #a5243d, var(--wine-red) 75%);
    color: #fcebeb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    box-shadow: 0 6px 18px rgba(107, 29, 47, 0.55), inset 0 0 8px rgba(255, 255, 255, 0.3);
  }

  .handwritten-letter-paper {
    width: 100%;
    max-height: 76vh;
    background:
      linear-gradient(#fdf8f2 0%, #f9efe4 100%);
    color: var(--paper-ink);
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: 0 25px 65px rgba(0, 0, 0, 0.72);
    overflow-y: auto;
    border: 1px solid #ead5c3;
    animation: unfoldLetter 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    user-select: text;
  }

  @keyframes unfoldLetter {
    from { opacity: 0; transform: translateY(18px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .letter-salutation {
    font-family: 'Dancing Script', cursive;
    font-size: 1.75rem;
    color: var(--wine-red);
    margin-bottom: 14px;
  }

  .letter-body-paragraphs p {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.22rem;
    line-height: 1.65;
    color: #2f1720;
    margin-bottom: 14px;
  }

  .letter-signature {
    font-family: 'Dancing Script', cursive;
    font-size: 1.65rem;
    color: var(--wine-red);
    text-align: right;
    margin-top: 18px;
  }

  /* CẢNH 5: LỜI NHẮN CUỐI */
  .final-scene-card {
    position: relative;
    width: 100%;
    padding: 28px 22px;
    border-radius: 24px;
    background: rgba(20, 9, 28, 0.76);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }

  .final-bg-backdrop {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.34;
    filter: blur(3px);
    z-index: -1;
  }

  .final-actions-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 22px;
  }

  /* Modal gửi lời nhắn phản hồi từ người nhận */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8, 3, 12, 0.82);
    backdrop-filter: blur(8px);
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .reply-modal-box {
    width: 100%;
    max-width: 410px;
    background: #21102b;
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 22px;
    color: var(--cream-white);
  }

  .reply-textarea {
    width: 100%;
    min-height: 100px;
    border-radius: 14px;
    border: 1px solid rgba(246, 187, 208, 0.35);
    background: rgba(12, 5, 18, 0.7);
    color: var(--cream-white);
    padding: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    margin: 12px 0;
    resize: vertical;
  }

  /* Hỗ trợ người dùng bật chế độ giảm chuyển động */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
